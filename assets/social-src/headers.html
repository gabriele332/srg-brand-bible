<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SRG social header compositor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     v4 (2026-08-18, Gabi): the three ORIGINAL carbon designs restored exactly
     as shipped — same grounds, layouts, tagline and compliance type. The ONLY
     change from v3's mistake is reverting the redesign; the only change from
     the original is the wordmark itself: Lora serif "Steadfast" + tracked
     RESEARCH GROUP, per the rebrand. Everything else stays as Blake approved.
       photo     - blurred product scene behind a centered lockup
       watermark - carbon ground, giant flag outline right, centered lockup
       cutout    - carbon ground, lockup left, two vial cutouts right
     ========================================================================== */
  html,body{margin:0;padding:0}
  #c{position:relative;overflow:hidden;font-family:"Lora",Georgia,serif;display:flex;background:#141414}
  .lk{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;color:#FFFFFF}
  .lk.center{align-items:center;text-align:center;width:100%}
  .lk .flag{background-size:contain;background-repeat:no-repeat}
  .lk b{font-weight:600;letter-spacing:.005em;line-height:1}
  .lk .rule{background:#FFFFFF;height:2px;opacity:.9}
  .lk small{display:block;font-family:"Lora",Georgia,serif;font-weight:500;letter-spacing:.42em;opacity:.92}
  .lk .tag{font-family:"Inter",sans-serif;font-weight:300;opacity:.92;color:#C9CDD4}
  .lk .ruo{font-family:"Space Mono",monospace;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
  .hl{display:grid;place-items:center;width:100%;height:100%}
  .hl svg{width:34%;height:34%}
</style>
</head>
<body>
<div id="c"></div>
<script>
const FLAG_WHITE = '/assets/logos-grotesk/srg-grotesk-white-icon.png';
const VIAL_BLACK = '/assets/social-src/vial-black.png';
const VIAL_OLIVE = '/assets/social-src/vial-olive.png';

/* platform canvases — EXACT dimensions of the files being replaced */
const PLATFORMS = {
  fb:  { w:2187, h:832,  pad:120, flagH:110, brand:84,  sub:26, tag:40, ruo:22 },
  li:  { w:4224, h:1056, pad:200, flagH:140, brand:106, sub:34, tag:52, ruo:28 },
  x:   { w:4000, h:1333, pad:220, flagH:150, brand:116, sub:36, tag:56, ruo:30 },
  yt:  { w:3413, h:1920, pad:0,   flagH:130, brand:96,  sub:32, tag:48, ruo:26, safe:true }
};

function lockup(p, centered) {
  const flagAlign = centered ? 'background-position:center;' : 'background-position:left center;';
  const ruleW = Math.round(p.brand * 5.4);
  return `
    <div class="flag" style="height:${p.flagH}px;width:100%;background-image:url(${FLAG_WHITE});${flagAlign}"></div>
    <b style="font-size:${p.brand}px;margin-top:${Math.round(p.flagH * 0.30)}px">Steadfast</b>
    <div class="rule" style="width:${ruleW}px;margin-top:${Math.round(p.brand * 0.42)}px"></div>
    <small style="font-size:${p.sub}px;margin-top:${Math.round(p.sub * 0.72)}px">RESEARCH GROUP</small>
    <div class="tag" style="font-size:${p.tag}px;margin-top:${Math.round(p.tag * 0.9)}px">Documented batch by batch.</div>
    <div class="ruo" style="font-size:${p.ruo}px;margin-top:${Math.round(p.ruo * 0.8)}px">For laboratory research use only</div>`;
}

function header(p, sname) {
  const c = document.getElementById('c');
  c.style.width = p.w + 'px'; c.style.height = p.h + 'px';

  const safeW = Math.round(p.w * 0.604), safeH = Math.round(p.h * 0.294);
  const centerBox = p.safe
    ? `width:${safeW}px;height:${safeH}px;margin:auto;`
    : `height:100%;`;

  let art = '', lk = '';
  if (sname === 'photo') {
    /* blurred product scene: the two vial renders, oversized and defocused */
    const vh = Math.round(p.h * 1.5);
    art = `<div style="position:absolute;inset:0;background:
             radial-gradient(120% 170% at 30% 0%, #2A2E33 0%, #17191C 55%, #101214 100%);"></div>
           <img src="${VIAL_BLACK}" style="position:absolute;left:12%;top:-14%;height:${vh}px;
             filter:blur(30px) brightness(.6);transform:rotate(-9deg);" />
           <img src="${VIAL_OLIVE}" style="position:absolute;right:10%;top:-20%;height:${Math.round(vh * 1.15)}px;
             filter:blur(30px) brightness(.55);transform:rotate(8deg);" />
           <div style="position:absolute;inset:0;background:rgba(10,11,12,.35)"></div>`;
    lk = `<div class="lk center" style="${centerBox}">${lockup(p, true)}</div>`;
  } else if (sname === 'watermark') {
    const wmH = Math.round(p.h * 1.6);
    art = `<div style="position:absolute;right:-${Math.round(wmH * 0.16)}px;top:-${Math.round(wmH * 0.12)}px;
             width:${wmH}px;height:${wmH}px;opacity:.07;
             background:url(${FLAG_WHITE}) center/contain no-repeat;"></div>`;
    lk = `<div class="lk center" style="${centerBox}">${lockup(p, true)}</div>`;
  } else { /* cutout */
    const vh = Math.round(p.h * (p.safe ? 0.82 : 0.86));
    const back = Math.round(vh * 0.82);
    art = `<img src="${VIAL_BLACK}" style="position:absolute;right:${p.safe ? '26%' : '30%'};top:${Math.round(p.h * 0.10)}px;height:${back}px;transform:rotate(-8deg);" />
           <img src="${VIAL_OLIVE}" style="position:absolute;right:${p.safe ? '8%' : '9%'};top:${Math.round(p.h * 0.07)}px;height:${vh}px;transform:rotate(7deg);" />`;
    lk = p.safe
      ? `<div class="lk" style="width:${safeW}px;height:${safeH}px;margin:auto;padding-left:${Math.round(safeW * 0.04)}px">${lockup(p, false)}</div>`
      : `<div class="lk" style="height:100%;padding-left:${p.pad}px;max-width:${Math.round(p.w * 0.46)}px">${lockup(p, false)}</div>`;
  }

  c.innerHTML = art + lk;
}

/* Shipping highlight: parcel icon (nothing ships cold — Shayne's ruling). */
const HL_GROUNDS = { black:{bg:'#141414', fg:'#FFFFFF'}, sage:{bg:'#869274', fg:'#FFFFFF'}, white:{bg:'#F4F1E8', fg:'#141414'} };
function highlight(wname) {
  const g = HL_GROUNDS[wname];
  const c = document.getElementById('c');
  c.style.width = '1440px'; c.style.height = '1440px'; c.style.background = g.bg;
  c.innerHTML = `<div class="hl">
    <svg viewBox="0 0 100 100" fill="none" stroke="${g.fg}" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 14 88 32v36L50 86 12 68V32Z"/>
      <path d="M12 32l38 18 38-18M50 50v36"/>
      <path d="M31 23l38 18v14"/>
    </svg></div>`;
}

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'fb-photo';           // e.g. fb-photo | yt-cutout | hl-white
const [kind, way] = id.split('-');
if (kind === 'hl') highlight(way); else header(PLATFORMS[kind], way);

const ready = () => { document.title = 'SHOT-READY-' + id; };
Promise.all([document.fonts.ready,
  Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })))
]).then(() => requestAnimationFrame(ready));
</script>
</body>
</html>
