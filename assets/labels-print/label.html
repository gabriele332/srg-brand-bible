<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SRG print label compositor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     Print label at Jessica's confirmed dieline (Slack 2026-08-11):
     1.5in x 0.75in trim for every vial (2.5in x 1in for BAC Water and NAD+),
     delivered with 1/8in bleed on every side since 2026-09-09 - see the
     dieline block in the script. Her three earlier revisions applied:
       - vector PDF output (this page is printed to PDF, type stays live)
       - the three compliance lines LARGER and BOLDER than the panel art
       - no flag at the very top: at 0.75in tall the old centered stack with
         an 8mm flag doesn't fit. The wordmark carries the brand; the flag
         stays on the cap emboss and the back of the wrap.
     Chrome maps 96 CSS px = 1in, so the artboard is exactly the bleed size
     in px and @page emits a PDF of that size with the art flooded to the edge.
     ========================================================================== */
  /* @page is set from JS per dieline (see the bleed note below). */
  html,body{margin:0;padding:0}
  /* Every dimension that depends on the dieline is set inline from JS as a
     computed pixel value — NO zoom and NO transform. Chrome's print pipeline
     treats zoom differently from screen, which mis-centered the strength box
     on the 2.5x1in BAC Water; plain computed layout renders identically on
     screen and in the PDF, so what the check screenshot shows is what prints. */
  #l{overflow:hidden;position:relative;
     font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;
     align-items:center;justify-content:center;text-align:center}
  /* Brand block: rebuilt at the PANEL ART's proportions (srg-label-*.svg:
     STEADFAST 33 / RESEARCH GROUP 14, ~42%) after Jessica's press test —
     the kit lockup's subline printed too small to read (Slack 2026-08-11,
     "the text under Steadfast is still small"). Flag = the kit icon asset
     verbatim; type = live Space Grotesk, same as the panel art. */
  #l .brand{display:flex;align-items:center;justify-content:center}
  #l .brand img{width:auto;display:block}
  #l .brand .words{text-align:left}
  #l .brand div{line-height:1}
  #l .name{font-family:'Lora',Georgia,serif;font-weight:600;letter-spacing:.01em;line-height:1;white-space:nowrap}
  /* Strength box centering: fixed height with matching line-height — padding
     maths under scaling is what let the figure drift off the box's centre. */
  #l .mg{display:inline-block;font-weight:700}
  /* Jessica: compliance larger and more bold — weight 700, ~⅓ of label height. */
  #l .c{font-weight:700;letter-spacing:.05em}
</style>
</head>
<body>
<div id="l"></div>
<script>
const SKUS = {
  rt10:  ['RETATRUTIDE', '10 MG'],  rt20: ['RETATRUTIDE', '20 MG'], rt30: ['RETATRUTIDE', '30 MG'],
  tr10:  ['TIRZEPATIDE', '10 MG'],  tr20: ['TIRZEPATIDE', '20 MG'], tr30: ['TIRZEPATIDE', '30 MG'],
  tsm5:  ['TESAMORELIN', '5 MG'],   tsm10:['TESAMORELIN', '10 MG'],
  bb10:  ['BPC157/TB500', '10 MG'], kpv10:['KPV', '10 MG'],
  cp10:  ['CJC1295/IPAMORELIN', '10 MG'], cu50: ['GHK-CU', '50 MG'],
  nj1000:['NAD+', '1000 MG'], hgh10:['HGH', '10 IU'], wa10: ['BAC WATER', '10 ML'],
  ss31: ['SS-31', '10 MG'], motsc: ['MOTS-C', '10 MG'],
  /* Shayne, 2026-09-10: the current SS-31 stock is 50 mg vials (same 3 mL
     glass), so this label runs until the 10 mg batch lands; keep both. */
  ss3150: ['SS-31', '50 MG'],
  /* generic label for Jessica's press test — matches the mockup vials */
  peptide: ['PEPTIDE', '5 MG']
};
/* colorways match the three label sets on the bible page */
const WAYS = {
  black: { bg:'#141414', fg:'#FFFFFF', boxBg:'#FFFFFF', boxFg:'#141414' },
  green: { bg:'#545A2D', fg:'#FFFFFF', boxBg:'#F4F1E8', boxFg:'#3A3D20' },
  white: { bg:'#F4F1E8', fg:'#23271F', boxBg:'#23271F', boxFg:'#F4F1E8' }
};

const DISPLAY = {
  rt10:'Retatrutide', rt20:'Retatrutide', rt30:'Retatrutide',
  tr10:'Tirzepatide', tr20:'Tirzepatide', tr30:'Tirzepatide',
  tsm5:'Tesamorelin', tsm10:'Tesamorelin',
  bb10:'BPC157/TB500', kpv10:'KPV', cp10:'CJC1295/Ipamorelin', cu50:'GHK-Cu',
  nj1000:'NAD+', hgh10:'HGH', wa10:'BAC Water', peptide:'Peptide',
  ss31:'SS-31', ss3150:'SS-31', motsc:'MOTS-c',
};
const q = new URLSearchParams(location.search);
const sku = q.get('sku') || 'bb10', way = q.get('way') || 'black';
const [name, mg] = SKUS[sku], w = WAYS[way];

/* Dielines. Jessica's test print of the green labels came out great; her one
   revision (Slack 2026-09-09) is that the FILES run slightly larger than the
   trimmed label so the art is guaranteed to print all the way to the edge:
     - every vial:         trim 1.5 x 0.75 in  ->  file 1.75 x 1 in
     - BAC Water and NAD+: trim 2.5 x 1 in     ->  file 2.75 x 1.25 in
   That is 1/8 in of bleed on every side. "The text on them can stay the
   same", so every layout value still scales off the TRIM height (S) and the
   centered stack simply sits inside the larger, edge-to-edge canvas.
   Chrome maps 96 CSS px = 1 in. */
const isBac = sku === 'wa10';
const isWide = isBac || sku === 'nj1000';
const TRIM = isWide ? [240, 96] : [144, 72];
const CANVAS = isWide ? [264, 120] : [168, 96];
const S = TRIM[1] / 72;
{
  const st = document.createElement('style');
  st.textContent = '@page{size:' + (CANVAS[0] / 96) + 'in ' + (CANVAS[1] / 96) + 'in;margin:0}';
  document.head.appendChild(st);
}
const px = v => (v * S).toFixed(2) + 'px';

/* the kit's flag icon, verbatim — white art on the dark colorways, black art
   on the light one. Transparency is fine here: the whole label is flattened
   into one screenshot before it ever reaches a PDF. */
const flag = way === 'white'
  ? '/assets/logos-grotesk/srg-grotesk-black-icon.png'
  : '/assets/logos-grotesk/srg-grotesk-white-icon.png';

const l = document.getElementById('l');
l.style.width = CANVAS[0] + 'px';
l.style.height = CANVAS[1] + 'px';
l.style.background = w.bg;
l.style.color = w.fg;
l.innerHTML =
  '<div class="brand" style="gap:' + px(2.5) + '">' +
    
    '<img src="' + flag + '" alt="" style="height:' + px(15) + '"/>' +
    '<div class="words">' +
      /* 2026-08 rebrand: serif wordmark (Lora), mixed case, flag unchanged */
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-weight:500;font-size:' + px(9) + ';letter-spacing:' + px(2.2) + '">STEADFAST</div>' +
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-weight:500;font-size:' + px(4.2) + ';letter-spacing:' + px(1.55) + ';margin-top:' + px(1.4) + '">RESEARCH GROUP</div>' +
      '<div style="height:0;border-bottom:0.6px solid currentColor;margin-top:' + px(1.6) + ';margin-left:0;margin-right:auto;width:' + px(56) + '"></div>' +
    '</div>' +
  '</div>' +
  '<div class="name" style="font-size:' + px(8.5) + ';margin-top:' + px(2) + '"></div>' +
  '<div class="mg" style="background:' + w.boxBg + ';color:' + w.boxFg +
    ';font-size:' + px(6) + ';height:' + px(8.6) + ';line-height:' + px(8.6) +
    ';padding:0 ' + px(4) + ';margin-top:' + px(1.8) + '">' + mg.replace(/ /g, '') + '</div>' +
  /* first compliance line matches the panel art: BAC water is a liquid, not
     a lyophilized powder */
  '<div class="c" style="font-size:' + px(4.9) + ';line-height:1.38;margin-top:' + px(1.8) + '">' +
  (isBac ? 'BACTERIOSTATIC WATER' : 'LYOPHILIZED POWDER') +
  '<br>FOR RESEARCH USE ONLY<br>NOT FOR HUMAN CONSUMPTION</div>';

/* long names shrink to fit inside the safe zone (~90% of the TRIM width -
   nothing may lean on the bleed, it is cut away) */
const nameEl = l.querySelector('.name');
nameEl.textContent = DISPLAY[sku] || name;
const maxW = TRIM[0] * 0.9;
let size = 8.5 * S;
nameEl.style.fontSize = size + 'px';
while (nameEl.scrollWidth > maxW && size > 6 * S) {
  size -= 0.5;
  nameEl.style.fontSize = size + 'px';
}

Promise.all([document.fonts.ready,
  Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })))
]).then(() => requestAnimationFrame(() => {
  document.title = 'SHOT-READY-' + sku + '-' + way;
}));
</script>
</body>
</html>
